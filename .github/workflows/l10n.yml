# Backstop for the l10n pipeline, on GitHub. Forgejo runs the same checks as
# `l10n sync` and `l10n gate` (.forgejo/workflows/), which are required on main.
#
# Since 2026-11-24 IntroVox is translated in VoxCloud's own Weblate:
# translationfiles/<lang>/introvox.po is the source, Weblate its only writer, and
# the POT and l10n/*.js|json are built from it with Nextcloud's own
# translationtool (scripts/l10n-sync.mjs, copied from design).
#
# The primary defence is the prebuild guard (scripts/check-l10n-sync.js), which
# runs on every `npm run build`. This workflow is the safety net for a commit
# that reaches main without a local build — the path by which the admin UI
# stayed untranslatable from 2026-06 to 2026-10: the POT went missing and no build
# ever complained.
#
# tests-js/l10n-bot-visibility.test.js simulates Nextcloud's extractor, which only
# sees t('introvox', '…') with literals: a string can be in the code, valid, and
# still never reach a translator.
#
# It is CHECK-ONLY on purpose — it never writes, commits or pushes. On a red run,
# run `npm run pot` locally and commit the POT + manifest.

name: l10n

on:
  push:
    branches: [main]
    paths:
      - 'appinfo/info.xml'
      - 'translationfiles/**'
      - 'src/**'
      - 'lib/**'
      - 'templates/**'
      - 'l10n/**'
      - 'tests-js/**'
      - 'scripts/**'
      - 'deploy.sh'
      - '.gitignore'
      - '.github/workflows/l10n.yml'
  pull_request:
    paths:
      - 'appinfo/info.xml'
      - 'translationfiles/**'
      - 'src/**'
      - 'lib/**'
      - 'templates/**'
      - 'l10n/**'
      - 'tests-js/**'
      - 'scripts/**'
      - 'deploy.sh'
      - '.gitignore'
      - '.github/workflows/l10n.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The extractor scans src/, lib/ and templates/ with plain regexes and
      # needs neither node_modules nor xgettext, but two tests do:
      # l10n-escaping loads @nextcloud/l10n and template-bindings compiles the
      # Vue templates with vue/compiler-sfc.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: l10n regression tests
        run: node --test tests-js/

      - name: Source strings in sync with the manifest
        run: node scripts/check-l10n-sync.js

      # Warning-only (exit 0) unless --strict: NC guideline nits should be
      # visible in the log without blocking an unrelated change.
      - name: Nextcloud translation-guideline lint
        run: node scripts/lint-l10n-strings.js

      # Proves the POT can still be regenerated and is valid gettext, before Weblate
      # gets a broken one. The POT and l10n/ come from Nextcloud's own translationtool
      # (scripts/l10n-sync.mjs, copied from design). `check` fails when either is out
      # of date. It ignores POT-Creation-Date and the #: references, so a line shift
      # elsewhere in the code is not a change and this step does not turn red for nothing.
      - name: php and gettext
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends php-cli php-xml gettext >/dev/null

      - name: POT and l10n/ are up to date
        run: |
          node scripts/l10n-sync.mjs check
          msgfmt --check-format -o /dev/null translationfiles/templates/introvox.pot
